<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#4a1015" />
    <meta name="description" content="Historia — eine umfangreiche Geschichts-Lernapp von der Steinzeit bis zur Gegenwart." />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Historia" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Historia — Geschichte erleben</title>

    <!-- Alles liegt im Repo: kein fremder CDN, offline lauffaehig.
         Tailwind wird nicht mehr im Browser erzeugt, sondern liegt als
         fertige Datei vor; JSX ist vorab uebersetzt, Babel entfaellt. -->
    <link rel="stylesheet" href="tailwind.css" />
    <script src="react.js"></script>
    <script src="react-dom.js"></script>

    <style>
      html, body, #root { height: 100%; }
      html, body { background-color: #4a1015; color-scheme: dark; color: #f0e6c8; margin: 0; }
      #boot-error { display:none; padding:20px; color:#f0dcae; font-family:monospace; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#e0b84a;font-family:sans-serif;">
        Historia wird geladen…
      </div>
    </div>
    <div id="boot-error"></div>

    <script>
      // Zeigt einen echten Fehlertext an, statt dass die Seite stumm auf "wird geladen" hängen bleibt
      window.addEventListener("error", function (e) {
        var el = document.getElementById("boot-error");
        if (el) {
          el.style.display = "block";
          el.textContent = "Ladefehler: " + (e.message || e.error) + "\n" + (e.filename || "") + ":" + (e.lineno || "");
        }
      });
    </script>

        <script src="app.js"></script>

    <script>
      (function () {
        function zeigeFehler(label, err) {
          var el = document.getElementById("boot-error");
          if (el) { el.style.display = "block"; el.textContent = label + ": " + (err && err.message ? err.message : err); }
          console.error(err);
        }
        try {
          var wurzel = ReactDOM.createRoot(document.getElementById("root"));
          wurzel.render(React.createElement(Historia));
        } catch (fehler) {
          zeigeFehler("Historia konnte nicht starten", fehler);
        }
      })();

      // Service Worker: laesst die App auch ohne Netz starten.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () { navigator.serviceWorker.register("./sw.js").catch(function () {}); });
      }
    </script>
  </body>
</html>
