<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#4a1015" />
    <meta name="description" content="Historia — eine umfangreiche Geschichts-Lernapp von der Steinzeit bis zur Gegenwart." />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Historia" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Historia — Geschichte erleben</title>

    <!-- Alles liegt im Repo: kein fremder CDN, offline lauffaehig.
         Tailwind wird nicht mehr im Browser erzeugt, sondern liegt als
         fertige Datei vor; JSX ist vorab uebersetzt, Babel entfaellt. -->
    <link rel="stylesheet" href="tailwind.css?v=2026-09-11-6" />
    <script src="react.js?v=2026-09-11-6"></script>
    <script src="react-dom.js?v=2026-09-11-6"></script>

    <style>
      html, body, #root { height: 100%; }
      html, body { background-color: #4a1015; color-scheme: dark; color: #f0e6c8; margin: 0; }
      #boot-error { display:none; padding:20px; color:#f0dcae; font-family:monospace; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#e0b84a;font-family:sans-serif;">
        Historia wird geladen…
      </div>
    </div>
    <div id="boot-error"></div>

    <script>
      // Zeigt einen echten Fehlertext an, statt dass die Seite stumm auf "wird geladen" hängen bleibt
      window.__ersterFehler = null;
      window.addEventListener("error", function (e) {
        var roh = String(e.message || e.error || "");
        var text = "Ladefehler: " + roh + "\n" + (e.filename || "") + ":" + (e.lineno || "");
        // Fehlt eine Datendatei, ist der technische Wortlaut unbrauchbar.
        // Dann lieber sagen, was zu tun ist.
        if (/EPOCHS|VERTIEFUNGEN|THEMEN|COUNTRY_TIMELINES|MYTHEN|MYSTERIEN|QUOTES|BATTLES|SCHLUESSELMOMENTE|SURPRISING_FACTS/.test(roh)) {
          text = "Historia konnte die Inhalte nicht laden.\n\n" +
                 "Wahrscheinlich liegt noch eine alte Fassung im Zwischenspeicher.\n" +
                 "Bitte die Seite einmal vollstaendig neu laden.\n\n" +
                 "Technisch: " + roh;
        }
        if (!window.__ersterFehler) window.__ersterFehler = text;
        var el = document.getElementById("boot-error");
        if (el) {
          el.style.display = "block";
          // Die erste Meldung nennt die Ursache, spaetere sind nur ihre Folge.
          el.textContent = window.__ersterFehler;
        }
      });
    </script>

    <script src="data-epochen.js?v=2026-09-11-6"></script>
    <script src="data-sammlungen.js?v=2026-09-11-6"></script>
    <script src="data-laender.js?v=2026-09-11-6"></script>
    <script src="data-mythen.js?v=2026-09-11-6"></script>
    <script src="data-vertiefungen.js?v=2026-09-11-6"></script>
    <script src="data-themen.js?v=2026-09-11-6"></script>
    <script src="data-mysterien.js?v=2026-09-11-6"></script>
    <script src="data-dynastien.js?v=2026-09-11-6"></script>
    <script src="data-grafiken.js?v=2026-09-11-6"></script>
    <script src="data-bilder.js?v=2026-09-11-6"></script>
    <script src="app.js?v=2026-09-11-6"></script>

    <script>
      (function () {
        function zeigeFehler(label, err) {
          var el = document.getElementById("boot-error");
          if (el) { el.style.display = "block"; el.textContent = window.__ersterFehler || (label + ": " + (err && err.message ? err.message : err)); }
          console.error(err);
        }
        try {
          // Sicherung: Wenn eine Datendatei fehlt, sagen wir das verstaendlich,
          // statt eine Folgemeldung ueber eine unbekannte Variable zu zeigen.
          var fehlend = [];
          if (typeof EPOCHS === "undefined") fehlend.push("Epochen");
          if (typeof VERTIEFUNGEN === "undefined") fehlend.push("Vertiefungen");
          if (typeof THEMEN === "undefined") fehlend.push("Themen");
          if (typeof COUNTRY_TIMELINES === "undefined") fehlend.push("Laender");
          if (typeof MYTHEN === "undefined") fehlend.push("Mythen");
          if (typeof MYSTERIEN === "undefined") fehlend.push("Mysterien");
          if (typeof QUOTES === "undefined") fehlend.push("Sammlungen");
          if (fehlend.length) {
            throw new Error("Diese Daten fehlen: " + fehlend.join(", ") +
              ". Meist hilft: Seite einmal vollstaendig neu laden.");
          }
          var wurzel = ReactDOM.createRoot(document.getElementById("root"));
          wurzel.render(React.createElement(Historia));
        } catch (fehler) {
          zeigeFehler("Historia konnte nicht starten", fehler);
        }
      })();

      // Service Worker: laesst die App auch ohne Netz starten.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () { navigator.serviceWorker.register("./sw.js").catch(function () {}); });
      }
    </script>
  </body>
</html>
